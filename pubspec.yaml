dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
#  min_sdk_android: 23 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#E8F5FE"
  image: assets/splash.png
  color_dark: "#121212"
  image_dark: assets/splash.png
  android_12:
    color: "#E8F5FE"
    color_dark: "#121212"
    # image: assets/splash_android_12.png
    # image_dark: assets/splash_android_12.png
    # icon_background_color: "#E8F5FE"
    # icon_background_color_dark: "#121212"
  android: true
  ios: true
  web: false

# The following section is specific to Flutter packages.
flutter:


  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
    - assets/splash.png
    - assets/splash.svg
    - assets/animations/
    - assets/auth/
    - assets/3d/
    - icons/
    - icons/referral/
    - icons/nav_bar_icons/
    - icons/settings/
    - icons/content_icons/
    - icons/post_icons/
    - icons/category_icons/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: AppleSDGothicNeo
      fonts:
        - asset: assets/fonts/100_AppleSDGothicNeo-Thin.otf
          weight: 100
        - asset: assets/fonts/200_AppleSDGothicNeo-UltraLight.otf
          weight: 200
        - asset: assets/fonts/300_AppleSDGothicNeo-Light.otf
          weight: 300
        - asset: assets/fonts/400_AppleSDGothicNeo-Medium.otf
          weight: 400
        - asset: assets/fonts/500_AppleSDGothicNeo-Regular.otf
          weight: 500
        - asset: assets/fonts/600_AppleSDGothicNeo-SemiBold.otf
          weight: 600
        - asset: assets/fonts/700_AppleSDGothicNeo-Bold.otf
          weight: 700
        - asset: assets/fonts/800_AppleSDGothicNeo-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/900_AppleSDGothicNeo-Heavy.otf
          weight: 900
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
