name: inzone
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 4.2.5+608


environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  animated_splash_screen: ^1.3.0
  flutter_svg: ^2.0.5
  choice: ^2.3.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  floating_draggable_widget: ^2.1.5
  image_picker: ^1.1.2
  comment_tree: ^0.3.0
  shared_preferences: ^2.3.1
  cached_network_image:
  action_slider: ^0.7.0
  flutter_expandable_fab: ^2.2.0
  flutter_floating_bottom_bar: ^1.2.0
  intl: ^0.20.2
  http: ^1.2.2
  flutter_advanced_drawer: ^1.3.6
  cloud_firestore: ^5.4.5
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.2
  url_launcher: ^6.3.1
  change_app_package_name: ^1.4.0
  appsflyer_sdk: ^6.15.1
  video_player: ^2.9.0
  in_app_purchase: ^3.2.1
  firebase_storage: ^12.3.5
  media_kit: ^1.1.11 # Primary package.
  media_kit_video: ^1.2.5 # For video rendering.
  media_kit_libs_video: ^1.0.5 # Native video dependencies.
  visibility_detector: ^0.4.0+2
  youtube_player_flutter: ^9.1.1
  animated_bottom_navigation_bar: ^1.4.0
  flutter_feather_icons: ^2.0.0
  purchases_flutter: ^8.8.0
  pull_to_refresh_flutter3: ^2.0.2

  path_provider: any
  flutter_native_splash: ^2.4.4
  skeleton_text: ^3.0.1
  colorful_safe_area: ^1.0.0
  image_stack: ^2.1.1
  bounce: ^1.0.2
  flutter_keyboard_visibility: ^6.0.0
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  provider: any
  get: ^4.7.2
  smooth_page_indicator: ^1.2.1
  go_router: ^15.1.1
  flutter_native_contact_picker: ^0.0.10
  permission_handler: ^12.0.0+1
  cloud_functions: ^5.5.0
  iconify_flutter: ^0.0.7
