<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>InZone Social Loop Tap Targets</title>
<style>
  :root{color-scheme:dark;--bg:#0b1020;--panel:rgba(14,20,42,.84);--panel-strong:#111933;--line:rgba(125,180,255,.18);--text:#e7ecff;--muted:#9db0df;--accent:#7dd3fc;--accent-2:#7c5cff;--good:#31d0aa;--warn:#f7c948;--bad:#ff6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at top,#172554 0,#0b1020 42%,#050814 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
  body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle at center,black 0,rgba(0,0,0,.2) 62%,transparent 100%);pointer-events:none}
  #hud{position:fixed;top:env(safe-area-inset-top,12px);left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 16px;z-index:4;pointer-events:auto}
  #hud .hud-btn{pointer-events:auto;justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(7,10,20,.56);color:var(--text);font-weight:700;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.24)}
  #hud .hud-btn:hover{filter:brightness(1.08)}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(7,10,20,.56);backdrop-filter:blur(12px);font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,.24);pointer-events:none}
  .chip small{color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  #meta{justify-self:center;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  #meta .chip{font-size:12px;font-weight:600;color:var(--muted)}
  #stage{position:absolute;inset:0}
  .t{position:absolute;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 28% 28%,#d9fbff 0,#7dd3fc 35%,#2563eb 100%);box-shadow:0 10px 30px rgba(34,211,238,.34),0 0 0 8px rgba(125,211,252,.09);transform:translate(-50%,-50%) scale(.15);animation:pop .16s ease-out forwards}
  .t:before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.72);opacity:.5}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.15);opacity:.2}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .panel{width:min(100%,980px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(16,24,48,.92),rgba(7,10,20,.88));backdrop-filter:blur(18px);box-shadow:0 22px 80px rgba(0,0,0,.4);pointer-events:auto;overflow:hidden}
  .panel .hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 18px 0}
  .title{font-size:18px;font-weight:800;letter-spacing:.01em}
  .sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px}
  .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  button{appearance:none;border:0;border-radius:14px;padding:12px 14px;font:700 14px/1.1 inherit;color:var(--text);background:linear-gradient(135deg,rgba(125,211,252,.2),rgba(124,92,255,.24));border:1px solid rgba(125,211,252,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer;transition:transform .12s ease,filter .12s ease}
  button:hover{transform:translateY(-1px);filter:brightness(1.05)}
  button.secondary{background:rgba(255,255,255,.04);border-color:rgba(157,176,223,.18)}
  button.good{background:linear-gradient(135deg,rgba(49,208,170,.22),rgba(125,211,252,.18));border-color:rgba(49,208,170,.24)}
  button.warn{background:linear-gradient(135deg,rgba(247,201,72,.22),rgba(255,255,255,.04));border-color:rgba(247,201,72,.28)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input,textarea{width:100%;border-radius:12px;border:1px solid rgba(157,176,223,.2);background:rgba(4,8,18,.85);color:var(--text);padding:11px 12px;font:inherit;outline:none}
  textarea{min-height:84px;resize:none}
  .field{display:grid;gap:8px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .pill{font-size:12px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(157,176,223,.16);color:var(--muted)}
  .pill[data-level="error"]{color:var(--bad);border-color:rgba(255,107,107,.3)}
  .pill[data-level="good"]{color:var(--good);border-color:rgba(49,208,170,.3)}
  #gameover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(1,3,10,.68);z-index:3;text-align:center;padding:24px}
  #gameover .big{font-size:42px;font-weight:900;letter-spacing:.02em}
  #gameover .score{font-size:18px;color:var(--muted)}
  #shareModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(1,3,10,.72);z-index:6}
  .gameover-panel{width:min(100%,720px)}
  .gameover-body{padding:18px;display:grid;gap:14px}
  .share-panel{width:min(100%,720px)}
  .share-body{padding:18px;display:grid;gap:12px}
  .share-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .share-targets{display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:820px){#hud{grid-template-columns:1fr;gap:8px}#meta{justify-self:start;justify-content:flex-start}.actions{grid-template-columns:1fr 1fr}.share-actions{grid-template-columns:1fr}.panel{border-radius:20px}}
</style>
</head>
<body>
  <div id="hud">
    <button class="hud-btn" id="backBtn">Back</button>
    <div class="chip"><small>Score</small><span id="score">0</span></div>
    <div id="meta">
      <div class="chip" id="gameLabel">Game: loading</div>
      <div class="chip" id="sessionLabel">Session: loading</div>
      <div class="chip" id="backendLabel">Backend: loading</div>
    </div>
    <div class="chip" style="justify-self:end"><small>Time</small><span id="time">20</span>s</div>
  </div>

  <div id="stage"></div>

  <div id="gameover">
    <div class="panel gameover-panel">
      <div class="hero">
        <div>
          <div class="title">Game Over</div>
          <div class="score">Final score: <span id="final">0</span></div>
        </div>
        <div class="pill" id="statusMsg" data-level="info">Ready.</div>
      </div>
      <div class="gameover-body">
        <div class="actions">
          <button class="good" id="playAgain">Play again (10 coins)</button>
          <button class="secondary" id="shareNow">Share card</button>
          <button class="secondary" id="challengeNow">Send challenge</button>
          <button class="secondary" id="chatNow">Open chat</button>
        </div>
        <div class="field">
          <label>Friend ID</label>
          <input id="recipientId" placeholder="friend_99" value="friend_99">
        </div>
        <div class="field">
          <label>Message</label>
          <textarea id="message">Beat my score if you can.</textarea>
        </div>
      </div>
    </div>
  </div>

  <div id="shareModal" aria-hidden="true">
    <div class="panel share-panel">
      <div class="hero">
        <div>
          <div class="title">Share your score</div>
          <div class="sub">Use the share sheet or copy the text and link.</div>
        </div>
        <button class="secondary" id="shareCloseBtn">Close</button>
      </div>
      <div class="share-body">
        <div class="field">
          <label>Share text</label>
          <textarea id="shareText" readonly></textarea>
        </div>
        <div class="field">
          <label>Share link</label>
          <input id="shareUrl" readonly>
        </div>
        <div class="share-actions">
          <button class="good" id="nativeShareBtn">Open share sheet</button>
          <button class="secondary" id="copyTextBtn">Copy text</button>
          <button class="secondary" id="copyUrlBtn">Copy link</button>
        </div>
        <div class="share-targets" id="shareTargets"></div>
      </div>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const over = document.getElementById('gameover');
  const finalEl = document.getElementById('final');
  const gameLabel = document.getElementById('gameLabel');
  const sessionLabel = document.getElementById('sessionLabel');
  const backendLabel = document.getElementById('backendLabel');
  const backBtn = document.getElementById('backBtn');
  const recipientIdEl = document.getElementById('recipientId');
  const messageEl = document.getElementById('message');
  const playAgainBtn = document.getElementById('playAgain');
  const challengeBtn = document.getElementById('challengeNow');
  const chatBtn = document.getElementById('chatNow');
  const statusMsg = document.getElementById('statusMsg');
  const shareModal = document.getElementById('shareModal');
  const shareTextEl = document.getElementById('shareText');
  const shareUrlEl = document.getElementById('shareUrl');
  const shareTargetsEl = document.getElementById('shareTargets');
  const nativeShareBtn = document.getElementById('nativeShareBtn');
  const copyTextBtn = document.getElementById('copyTextBtn');
  const copyUrlBtn = document.getElementById('copyUrlBtn');
  const shareCloseBtn = document.getElementById('shareCloseBtn');

  const retryCost = 10;

  const state = {
    score: 0,
    timeLeft: 20,
    timer: null,
    spawner: null,
    gameId: null,
    gameName: null,
    sessionId: null,
    backendBaseUrl: 'http://192.168.1.189:8080',
    gameKey: 'dev-test-key',
    userId: null,
    fixtureMode: false,
  };

  let currentSharePayload = null;

  function log(message, level = 'info') {
    const line = `${level.toUpperCase()}: ${message}`;
    if (statusMsg) {
      statusMsg.textContent = line;
      statusMsg.dataset.level = level;
    }
    if (level === 'error') {
      console.error(line);
    } else {
      console.log(line);
    }
  }

  function updateHeader() {
    gameLabel.textContent = `Game: ${state.gameName || state.gameId || 'unknown'}`;
    sessionLabel.textContent = `Session: ${state.sessionId || 'none'}`;
    backendLabel.textContent = `Backend: ${state.backendBaseUrl || 'n/a'}`;
  }

  function hydrateFromConfig(config) {
    if (!config || typeof config !== 'object') return;
    state.gameId = config.gameId || state.gameId;
    state.gameName = config.gameName || state.gameName;
    state.sessionId = config.sessionId || state.sessionId;
    state.backendBaseUrl = config.backendBaseUrl || state.backendBaseUrl;
    state.gameKey = config.gameKey || state.gameKey;
    state.userId = config.userId || state.userId;
    state.fixtureMode = !!config.fixtureMode;
    updateHeader();
  }

  async function ensureBridge() {
    if (window.InZoneSDK && typeof window.InZoneSDK.getConfig === 'function') {
      return window.InZoneSDK.getConfig();
    }
    return new Promise((resolve) => {
      const listener = (event) => {
        hydrateFromConfig(event.detail);
        window.removeEventListener('inzone:sdk-ready', listener);
        resolve(event.detail);
      };
      window.addEventListener('inzone:sdk-ready', listener, { once: true });
    });
  }

  function sdkConfig() {
    return {
      gameId: state.gameId || '',
      gameName: state.gameName || '',
      gameKey: state.gameKey || '',
      backendBaseUrl: state.backendBaseUrl || '',
      sessionId: state.sessionId || '',
      userId: state.userId || '',
      playerId: state.userId || '',
    };
  }

  async function callSdk(action, payload = {}) {
    await ensureBridge();
    if (!window.InZoneSDK || typeof window.InZoneSDK[action] !== 'function') {
      throw new Error(`SDK action unavailable: ${action}`);
    }
    hydrateFromConfig(Object.assign({}, sdkConfig(), payload));
    let response;
    if (action === 'purchaseCoinTier') {
      if (typeof payload.coins !== 'number') {
        throw new Error('coins is required for purchaseCoinTier');
      }
      response = await window.InZoneSDK.purchaseCoinTier(payload.coins, Object.assign({}, sdkConfig(), payload));
    } else {
      response = await window.InZoneSDK[action](Object.assign({}, sdkConfig(), payload));
    }
    log(`${action}: ${JSON.stringify(response).slice(0, 600)}`);
    return response;
  }

  function spawn() {
    const el = document.createElement('div');
    el.className = 't';
    el.style.left = (40 + Math.random() * (innerWidth - 80)) + 'px';
    el.style.top = (96 + Math.random() * (innerHeight - 220)) + 'px';
    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      state.score += 1;
      scoreEl.textContent = state.score;
      el.remove();
    });
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1250);
  }

  async function finishGame() {
    clearInterval(state.timer);
    clearInterval(state.spawner);
    stage.innerHTML = '';
    const scoreValue = Number.isFinite(state.score) ? state.score : 0;
    finalEl.textContent = scoreValue;
    over.style.display = 'flex';
    try {
      const scoreResponse = await callSdk('postScore', {
        gameId: state.gameId,
        gameName: state.gameName,
        playerId: state.userId,
        userId: state.userId,
        score: scoreValue,
        durationMs: 20000 - state.timeLeft * 1000,
        sessionId: state.sessionId,
        level: Math.max(1, Math.floor(state.score / 5)),
        platform: 'flutter-webview',
      });
      log(`Score posted: ${JSON.stringify(scoreResponse.data || scoreResponse).slice(0, 400)}`);
    } catch (error) {
      log(`postScore failed: ${error.message}`, 'error');
    }
  }

  function finishedScore() {
    const parsed = Number(finalEl.textContent || state.score || 0);
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function start() {
    state.score = 0;
    state.timeLeft = 20;
    scoreEl.textContent = 0;
    timeEl.textContent = state.timeLeft;
    stage.innerHTML = '';
    over.style.display = 'none';
    setShareModalVisible(false);
    clearInterval(state.timer);
    clearInterval(state.spawner);
    state.spawner = setInterval(spawn, 650);
    state.timer = setInterval(() => {
      state.timeLeft -= 1;
      timeEl.textContent = state.timeLeft;
      if (state.timeLeft <= 0) {
        finishGame();
      }
    }, 1000);
  }

  function isSuccess(response) {
    if (!response || typeof response !== 'object') return false;
    if (response.success === true) return true;
    if (response.data && response.data.success === true) return true;
    return false;
  }

  function setReplayBusy(isBusy, label) {
    playAgainBtn.disabled = isBusy;
    playAgainBtn.textContent = isBusy ? label : `Play again (${retryCost} coins)`;
  }

  function requireGameKey() {
    const key = state.gameKey;
    if (!key) {
      log('gameKey is required for coin purchases.', 'error');
      return null;
    }
    return key;
  }

  function requireUserId() {
    if (!state.userId) {
      log('userId is required for this action.', 'error');
      return null;
    }
    return state.userId;
  }

  function requireRecipientId() {
    const value = (recipientIdEl.value || '').trim();
    if (!value) {
      log('recipientId is required for challenges.', 'error');
      return null;
    }
    return value;
  }

  function setShareModalVisible(visible) {
    if (!shareModal) return;
    shareModal.style.display = visible ? 'flex' : 'none';
    shareModal.setAttribute('aria-hidden', visible ? 'false' : 'true');
  }

  function renderShareTargets(targets) {
    if (!shareTargetsEl) return;
    shareTargetsEl.innerHTML = '';
    if (!Array.isArray(targets) || targets.length === 0) return;
    targets.forEach((target) => {
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = target;
      shareTargetsEl.appendChild(pill);
    });
  }

  function buildSharePayload(response) {
    const data = response && response.data && typeof response.data === 'object' ? response.data : response || {};
    const shareCard = data.shareCard || {};
    const title = shareCard.title || data.title || `I scored ${state.score} in ${state.gameName || state.gameId || 'InZone'}!`;
    const text = shareCard.message || data.message || messageEl.value || 'Can you beat me?';
    const url = shareCard.url || data.url || `https://inzone.app/game/${state.gameId || ''}`;
    const targets = data.shareTargets || response.shareTargets || [];
    return { title: title, text: text, url: url, targets: targets };
  }

  async function copyToClipboard(text) {
    if (!text) return false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (error) {
      console.warn('Clipboard API failed', error);
    }
    const temp = document.createElement('textarea');
    temp.value = text;
    temp.setAttribute('readonly', '');
    temp.style.position = 'absolute';
    temp.style.left = '-9999px';
    document.body.appendChild(temp);
    temp.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(temp);
    return ok;
  }

  function openShareModal(payload) {
    currentSharePayload = payload;
    if (shareTextEl) {
      shareTextEl.value = `${payload.title}\n${payload.text}`.trim();
    }
    if (shareUrlEl) {
      shareUrlEl.value = payload.url || '';
    }
    renderShareTargets(payload.targets);
    setShareModalVisible(true);
  }

  async function openShareSheet(payload) {
    if (navigator.share) {
      try {
        await navigator.share({ title: payload.title, text: payload.text, url: payload.url });
        log('Share sheet opened.', 'good');
        return true;
      } catch (error) {
        log('Share sheet closed or unavailable.', 'error');
      }
    }
    return false;
  }

  async function requireReplayPurchase() {
    setReplayBusy(true, 'Purchasing...');
    try {
      const key = requireGameKey();
      if (!key) return;
      const response = await callSdk('purchaseCoinTier', {
        coins: retryCost,
        gameId: state.gameId,
        userId: state.userId,
        title: `${retryCost} coin retry`,
        description: 'Retry purchase for another run',
        sessionId: state.sessionId,
      });
      if (!isSuccess(response)) throw new Error('Purchase rejected');
      log('Replay purchase approved.');
      start();
    } catch (error) {
      log(`Replay purchase failed: ${error.message}`, 'error');
    } finally {
      setReplayBusy(false);
    }
  }

  async function boot() {
    const config = await ensureBridge();
    hydrateFromConfig(config || window.__INZONE_SOCIAL_LOOP_CONFIG__ || {});
    updateHeader();
    log('Social loop page ready.');
    start();
  }

  playAgainBtn.addEventListener('click', requireReplayPurchase);
  document.getElementById('shareNow').addEventListener('click', async () => {
    try {
      const response = await callSdk('shareCard', {
        gameId: state.gameId,
        userId: state.userId,
        playerId: state.userId,
        score: finishedScore(),
        title: `I scored ${state.score} in ${state.gameName || state.gameId}!`,
        message: messageEl.value,
        template: 'tap-targets',
        sessionId: state.sessionId,
      });
      const payload = buildSharePayload(response);
      const opened = await openShareSheet(payload);
      if (!opened) {
        openShareModal(payload);
      }
    } catch (error) {
      log(`shareCard failed: ${error.message}`, 'error');
    }
  });
  challengeBtn.addEventListener('click', async () => {
    const senderId = requireUserId();
    const recipientId = requireRecipientId();
    if (!senderId || !recipientId) return;
    try {
      await callSdk('sendChallenge', {
        gameId: state.gameId,
        senderId: senderId,
        recipientId: recipientId,
        score: finishedScore(),
        message: messageEl.value,
        sessionId: state.sessionId,
        challengeType: 'duel',
      });
      log('Challenge sent.', 'good');
    } catch (error) {
      log(`sendChallenge failed: ${error.message}`, 'error');
    }
  });
  chatBtn.addEventListener('click', async () => {
    try {
      await callSdk('openChat', {
        gameId: state.gameId,
        userId: state.userId,
        sessionId: state.sessionId,
        context: {
          score: finishedScore(),
          gameName: state.gameName || state.gameId,
        },
      });
      log('Chat opened.', 'good');
    } catch (error) {
      log(`openChat failed: ${error.message}`, 'error');
    }
  });
  backBtn.addEventListener('click', async () => {
    try {
      await callSdk('close');
    } catch (error) {
      log(`close failed: ${error.message}`, 'error');
      history.back();
    }
  });

  nativeShareBtn.addEventListener('click', async () => {
    if (!currentSharePayload) return;
    const opened = await openShareSheet(currentSharePayload);
    if (!opened) {
      log('Share sheet not available on this device.', 'error');
    }
  });

  copyTextBtn.addEventListener('click', async () => {
    if (!currentSharePayload) return;
    const text = shareTextEl ? shareTextEl.value : '';
    const ok = await copyToClipboard(text);
    log(ok ? 'Share text copied.' : 'Copy failed.', ok ? 'good' : 'error');
  });

  copyUrlBtn.addEventListener('click', async () => {
    if (!currentSharePayload) return;
    const text = shareUrlEl ? shareUrlEl.value : '';
    const ok = await copyToClipboard(text);
    log(ok ? 'Share link copied.' : 'Copy failed.', ok ? 'good' : 'error');
  });

  shareCloseBtn.addEventListener('click', () => {
    setShareModalVisible(false);
  });

  window.addEventListener('pointerdown', () => {
    if (over.style.display === 'flex') return;
    spawn();
  });

  window.addEventListener('inzone:sdk-ready', (event) => {
    hydrateFromConfig(event.detail || {});
    updateHeader();
  });

  boot();
</script>
</body>
</html>
