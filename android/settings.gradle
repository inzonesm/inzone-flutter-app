pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false 
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.2" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"

// Unity exported library – created by Unity > Build Settings > Android >
// Export Project into android/unityLibrary. Only wired in when present so
// plain Flutter builds keep working before the export is made.
def unityLibraryDir = new File(settingsDir, "unityLibrary")
if (unityLibraryDir.exists()) {
    include ":unityLibrary"
    project(":unityLibrary").projectDir = unityLibraryDir
}
