plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "2"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.1"
}

android {
    namespace = "com.aadeshkheria.inzone"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 11
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.aadeshkheria.inzone"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

signingConfigs {
        release {
            storePassword = "@Inzone2023"
            keyPassword = "@Inzone2023"
            keyAlias = "key"
            storeFile = file("key.jks") // Relative path to the key.jks file in the `android` folder
        }
    }
       buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    
    // Packaging options for 16KB page size support
    packaging {
        jniLibs {
            // AGP 8.5.1+ automatically aligns to 16KB
            // Using uncompressed libraries (default) for better performance
            useLegacyPackaging = false
        }
    }
}

flutter {
    source = "../.."
}


dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.facebook.android:facebook-android-sdk:17.0.2'  // Updated for 16KB support
    implementation "com.miui.referrer:homereferrer:1.0.0.6"
    implementation 'com.appsflyer:af-android-sdk:6.15.3'  // Latest stable version
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    // Required for flutter_local_notifications desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
